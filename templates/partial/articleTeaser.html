<div class="col-md-3 col-sm-6 col-padding">
    <div class="blog-entry">
        {% if article.image is defined %}
            <a href="{{ SITEURL }}/{{ article.url }}" class="blog-img"><img src="{{ article.image|replace('"', '&quot;') }}" class="img-responsive" alt="{{ article.title }}"></a>
        {% endif %}
        <div class="desc">
            <h3><a href="{{ SITEURL }}/{{ article.url|replace('"', '&quot;')}}">{{ article.title }}</a></h3>
        </div>
    </div>
</div>
